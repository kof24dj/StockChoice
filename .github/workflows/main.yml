name: Daily Stock Scan

on:
  schedule:
    # GitHub 使用格林威治時間(UTC)，台灣時間下午 4 點 = UTC 早上 8 點
    # 設定為每週一到週五，早上 08:00 執行
    - cron: '0 8 * * 1-5' 
  workflow_dispatch: # 這個設定讓你可以隨時點擊按鈕「手動執行」

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 取得最新程式碼
      uses: actions/checkout@v3

    - name: 2. 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. 安裝必備套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. 執行台股掃描與籌碼查詢
      run: python batch_scanner.py

    - name: 5. 將最新的資料 (data.json) 存回雲端基地
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.json
        git commit -m "自動更新今日股市數據" -a || exit 0
        git push
